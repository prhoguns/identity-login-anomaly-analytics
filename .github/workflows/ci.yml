name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  queries:
    runs-on: ubuntu-latest
    env:
      MIN_ROWS: "1000"  # the synthetic fixture is smaller than the real data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.14", cache: pip}
      - run: pip install -r requirements.txt
      - name: Every script and the dashboard compile
        run: python -m py_compile scripts/*.py dashboard.py
      - name: Build a synthetic fixture and run all 18 queries against it
        run: |
          python scripts/make_fixture.py
          python scripts/build_db.py
          python scripts/run.py | tee run.log
      - name: Every query returns rows
        run: "! grep -E ' 0 rows$' run.log"
